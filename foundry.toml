[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
network = "monad"
fs_permissions = [{ access = "read", path = "./out" }]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_testnet_backup = "https://rpc-testnet.monadinfra.com"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
